          "@type": "Question",
          "name": "什麼是榮格 8 大認知功能測驗？與坊間 16 型人格有何不同？",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "常見的 16 型人格測試常被簡化為二元性格標籤。而榮格八大認知功能（Fe, Ti, Ne, Ni, Se, Si, Te, Fi）才是底層心理學的真正基石。評估這 8 大功能的強度順序，才能看見大腦處理資訊與做決策的底層機制。"
          }
        },
        {
          "@type": "Question",
          "name": "數據邏輯派（Grant 規則模型）與行為表現派（Myers 現實模型）有什麼差別？",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "這正是 iNY 獨創的雙模型對照分析核心。數據邏輯派（Grant 規則模型）採用嚴格的內外向交替規則功能棧；行為表現派（Myers 現實模型）則直接統計日常情境題目中的真實偏好加權。兩派對照能完整呈現內心思維與外在行為的真實立體層次。"
          }
        },
        {
          "@type": "Question",
          "name": "為什麼測驗結果會出現影子人格（Shadow Functions）？",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "在榮格與約翰·畢比（John Beebe）的原型模型中，除了意識層面最常調用的 4 個核心功能外，其餘 4 個方向相反的功能潛藏於潛意識深處，合稱為影子人格（Shadow Functions）。在壓力或危機防禦時被觸發，覺察影子人格（Shadow Functions）是邁向人格整合與成熟的關鍵。"
          }
        },
        {
          "@type": "Question",
          "name": "iNY 測驗是如何計算我的軸心能量分佈與百分比的？",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "iNY 採用 96 道情境題目，每項功能約 11 至 13 題李克特 5 點量表題，分數加總後按題數轉換為 0% 至 100% 能量百分比，繪製出個人雷達圖與雙軌報告。"
          }
        }
      ]
